[package]
name = "blueide"
version = "0.1.0"
edition = "2021"
description = "A terminal-based Kotlin IDE inspired by Turbo Pascal, with LSP support"
license = "MIT"
readme = "README.md"

[[bin]]
name = "blueide"
path = "src/main.rs"

[lib]
name = "blueide"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
